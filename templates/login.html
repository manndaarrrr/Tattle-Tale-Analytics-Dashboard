<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Tattle Tale</title>
    <meta name="description" content="Admin login for Tattle Tale analytics dashboard.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ── Reset & Base ────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-base:    #0b0e17;
            --bg-surface: rgba(255, 255, 255, 0.04);
            --bg-card:    rgba(255, 255, 255, 0.06);
            --text-primary: #e8eaf0;
            --text-secondary: #8b8fa3;
            --primary:    #6c63ff;
            --primary-glow: rgba(108, 99, 255, 0.35);
            --accent:     #00d9a6;
            --error:      #ff6b6b;
            --border:     rgba(255, 255, 255, 0.08);
            --radius:     16px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* ── Animated Background ────────────────────────────── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 600px 600px at 20% 30%, rgba(108,99,255,0.12), transparent),
                radial-gradient(ellipse 500px 500px at 80% 70%, rgba(0,217,166,0.08), transparent);
            animation: bgShift 12s ease-in-out infinite alternate;
            z-index: 0;
        }
        @keyframes bgShift {
            0%   { transform: scale(1) translateY(0); }
            100% { transform: scale(1.1) translateY(-30px); }
        }

        /* ── Login Card ─────────────────────────────────────── */
        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 48px 40px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            animation: cardIn 0.6s ease-out;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(24px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ── Logo / Brand ───────────────────────────────────── */
        .login-brand {
            text-align: center;
            margin-bottom: 36px;
        }
        .login-brand .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px var(--primary-glow);
        }
        .login-brand h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .login-brand h1 span {
            color: var(--accent);
        }
        .login-brand p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        /* ── Form ───────────────────────────────────────────── */
        .login-form { display: flex; flex-direction: column; gap: 20px; }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            font-size: 15px;
            color: var(--text-primary);
            font-family: inherit;
            transition: border-color 0.25s, box-shadow 0.25s;
            outline: none;
        }
        .form-group input::placeholder {
            color: rgba(139, 143, 163, 0.5);
        }
        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        /* ── Error Message ──────────────────────────────────── */
        .error-msg {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.25);
            color: var(--error);
            font-size: 13px;
            padding: 10px 14px;
            border-radius: 8px;
            text-align: center;
            animation: shake 0.4s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        /* ── Submit Button ──────────────────────────────────── */
        .login-btn {
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.25s;
            letter-spacing: 0.3px;
            margin-top: 4px;
        }
        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px var(--primary-glow);
        }
        .login-btn:active {
            transform: translateY(0);
        }

        /* ── Footer Link ────────────────────────────────────── */
        .login-footer {
            text-align: center;
            margin-top: 24px;
        }
        .login-footer a {
            font-size: 13px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }
        .login-footer a:hover {
            color: var(--accent);
        }
        .login-footer a svg {
            width: 14px;
            height: 14px;
            vertical-align: -2px;
            margin-right: 4px;
        }

        /* ── Responsive ─────────────────────────────────────── */
        @media (max-width: 480px) {
            .login-card {
                padding: 36px 24px;
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-brand">
                <div class="logo-icon">TT</div>
                <h1>Tattle Tale <span>Admin</span></h1>
                <p>Sign in to access the analytics dashboard</p>
            </div>

            <form class="login-form" method="POST" action="/login" id="loginForm">

                {% if error %}
                <div class="error-msg">{{ error }}</div>
                {% endif %}

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email"
                           placeholder="admin@tattletale.org"
                           autocomplete="email" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           placeholder="Enter any password (demo)"
                           autocomplete="current-password" required>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    Sign In
                </button>
            </form>

            <div class="login-footer">
                <a href="/">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                         stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M15 19l-7-7 7-7"/>
                    </svg>
                    Back to Tattle Tale
                </a>
            </div>
        </div>
    </div>
</body>
</html>
